spring:
  application:
    name: ussd-gateway
  data:
    redis:
      host: ${USSD_REDIS_HOST:localhost}
      port: ${USSD_REDIS_PORT:6382}

server:
  port: ${USSD_PORT:8280}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
